<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>From the declaration to the state: sequence of the KNX integration (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="980" y="548" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="20" width="160" height="40" rx="8" fill="#eef4fb" stroke="#2979d6"/>
    <text x="120" y="45" fill="#1d4f8c">User</text>
    <rect x="290" y="20" width="160" height="40" rx="8" fill="#eef4fb" stroke="#2979d6"/>
    <text x="370" y="45" fill="#1d4f8c">Gladys</text>
    <rect x="540" y="20" width="160" height="40" rx="8" fill="#edf7f1" stroke="#209678"/>
    <text x="620" y="45" fill="#14614d">Integration</text>
    <rect x="790" y="20" width="170" height="40" rx="8" fill="#f2fbf4" stroke="#0cb14b"/>
    <text x="875" y="45" fill="#0a7a35">KNX interface / bus</text>
  </g>
  <g stroke="#c3ccd5" stroke-dasharray="5 5" stroke-width="1.5">
    <line x1="120" y1="60" x2="120" y2="530"/>
    <line x1="370" y1="60" x2="370" y2="530"/>
    <line x1="620" y1="60" x2="620" y2="530"/>
    <line x1="875" y1="60" x2="875" y2="530"/>
  </g>

  <g font-size="12" fill="#24303c" stroke="#46505a" stroke-width="1.8">
    <line x1="120" y1="95" x2="364" y2="95" marker-end="url(#arrow)"/>
    <line x1="370" y1="125" x2="614" y2="125" marker-end="url(#arrow)"/>
    <line x1="620" y1="155" x2="376" y2="155" marker-end="url(#arrow)"/>
    <line x1="120" y1="200" x2="364" y2="200" marker-end="url(#arrow)"/>
    <line x1="370" y1="230" x2="614" y2="230" marker-end="url(#arrow)"/>
    <line x1="620" y1="260" x2="869" y2="260" marker-end="url(#arrow)"/>
    <line x1="875" y1="290" x2="626" y2="290" marker-end="url(#arrow)"/>
    <line x1="620" y1="320" x2="376" y2="320" marker-end="url(#arrow)"/>
    <line x1="120" y1="370" x2="364" y2="370" marker-end="url(#arrow)"/>
    <line x1="370" y1="400" x2="614" y2="400" marker-end="url(#arrow)"/>
    <line x1="620" y1="430" x2="869" y2="430" marker-end="url(#arrow)"/>
    <line x1="875" y1="470" x2="626" y2="470" marker-end="url(#arrow)"/>
    <line x1="620" y1="500" x2="376" y2="500" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#24303c" stroke="none">
    <text x="130" y="89">“Declare a light” + addresses</text>
    <text x="380" y="119">action add_light</text>
    <text x="380" y="149">setConfig(knx_devices) + discovered devices</text>
    <text x="130" y="194">Discover tab → Add</text>
    <text x="380" y="224">device created</text>
    <text x="630" y="254">GroupValueRead (status address)</text>
    <text x="630" y="284">GroupValueResponse</text>
    <text x="380" y="314">state (DPT → Gladys value)</text>
    <text x="130" y="364">turns the light on</text>
    <text x="380" y="394">setValue(switch, 1)</text>
    <text x="630" y="424">GroupValueWrite 1/1/1 = 1 (DPT 1.001)</text>
    <text x="630" y="464">status 1/1/2 = 1 (actuator)</text>
    <text x="380" y="494">state, changes only (240 / min at most)</text>
  </g>
</svg>
