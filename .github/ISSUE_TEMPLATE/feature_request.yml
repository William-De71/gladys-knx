name: Feature request
description: Something the integration could do for you.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The use case first (a scene, a dashboard, a KNX device type…), then the idea. For a device type, give its datapoint types (DPT) in ETS.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Gladys and integration versions
      placeholder: 'Gladys 5.1.4, integration 0.1.0'
