name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The **Test the connection** button of the configuration and the **KNX bus** widget often tell where it stops: paste their messages below.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.4'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → KNX, Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: gateway
    attributes:
      label: KNX IP interface or router
      description: Brand, model and connection mode (UDP tunnelling, TCP tunnelling, KNX IP Secure, routing).
      placeholder: 'MDT SCN-IP100.03, UDP tunnelling'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The device type, its group addresses and their datapoint types (DPT) in ETS help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Logs tab of the integration page), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines. Remove passwords first.
      render: text
